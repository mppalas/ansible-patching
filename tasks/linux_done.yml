---
- name: Check that the required services are running
  ansible.builtin.command: "systemctl is-active {{ item }}"
  loop: "{{ check_services }}"
  register: service_check
  until: service_check.rc == 0
  retries: 6
  delay: 10
  changed_when: false
  check_mode: false

- name: All updates are done
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: all updates are done. Rounds used: {{ round_no }}. Services running: {{ check_services | join(', ') }}"
